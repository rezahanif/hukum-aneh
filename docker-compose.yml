# docker-compose.yml
# Local development environment for hukum-aneh.
# Provides: PostgreSQL 16 & Hukum Aneh API Server.
# Firestore emulator not included — uses real Firebase project credentials via env.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hukum-aneh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hukum_aneh
      POSTGRES_USER: hukum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro  # auto-run on first init only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hukum -d hukum_aneh"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hukum-aneh-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - STORAGE_MODE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=hukum_aneh
      - POSTGRES_USER=hukum
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localdev}
      - QDRANT_HOST=63213460-7671-4d9f-a940-3a5b70f466d1.eu-central-1-0.aws.cloud.qdrant.io
      - QDRANT_PORT=6334
      - QDRANT_COLLECTION=hukum_aneh_laws
      - QDRANT_VECTOR_SIZE=1536
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ROUTER9_BASE_URL=${ROUTER9_BASE_URL}
      - ROUTER9_API_KEY=${ROUTER9_API_KEY}
      - GOOGLE_CREDENTIALS_PATH=/project/google-credentials.json
      - GOOGLE_TOKEN_PATH=/project/token.json
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
    volumes:
      - /project/google-credentials.json:/project/google-credentials.json:ro
      - /project/token.json:/project/token.json:rw
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
